name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify installation
        run: python -c "from markitdown_app.converter import FileConverter; print('Import OK')"

      - name: Build executable
        run: pyinstaller build.spec --distpath dist --workpath build_temp --clean -y

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-Windows-v${{ inputs.version }}
          path: dist/MarkItDown.exe

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MarkItDown-Windows-v${{ inputs.version }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: MarkItDown v${{ inputs.version }}
          body: |
            ## MarkItDown v${{ inputs.version }}

            ### Download
            - **MarkItDown.exe** — Standalone Windows application (no Python required)

            ### Supported Formats
            PDF, DOCX, PPTX, XLSX, XLS, CSV, HTML, EPUB, Images, Audio, Jupyter Notebooks, Outlook MSG, ZIP, and plain text files.

            ### Usage
            1. Download `MarkItDown.exe` below
            2. Run it — no installation needed
            3. Add files or folders, click **Convert to Markdown**
          files: release-assets/MarkItDown.exe
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
