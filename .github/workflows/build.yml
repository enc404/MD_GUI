name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run import test
        run: python -c "from markitdown_app.converter import FileConverter; print('Import OK')"

      - name: Run conversion test
        run: python -c "from markitdown_app.converter import FileConverter; fc = FileConverter(); print('Supported extensions:', len([e for e in fc._md._converters])); print('All checks passed')"

  build:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: MarkItDown-Windows
            artifact_path: dist/MarkItDown.exe
          - os: ubuntu-latest
            artifact_name: MarkItDown-Linux
            artifact_path: dist/MarkItDown
          - os: macos-latest
            artifact_name: MarkItDown-macOS
            artifact_path: dist/MarkItDown.app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build executable
        run: pyinstaller build.spec --distpath dist --workpath build_temp --clean -y

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
